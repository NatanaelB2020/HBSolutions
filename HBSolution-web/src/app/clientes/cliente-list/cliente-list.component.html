<section class="cliente-list-container">
    <h2>Clientes</h2>

    <table *ngIf="clientes.length; else vazio">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let cliente of clientes">
                <td>{{ cliente.nome || '-' }}</td>
                <td>{{ cliente.email || '-' }}</td>
                <td>{{ cliente.telefone || '-' }}</td>
                <td>
                    <a [routerLink]="['/clientes', cliente.id, 'historico']">Ver histórico</a>
                </td>
            </tr>
        </tbody>
    </table>

    <ng-template #vazio>
        <p>Nenhum cliente encontrado.</p>
    </ng-template>
</section>
